<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QL VPP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">QL VPP</div>
    <nav class="sidebar-nav">
      <button type="button" class="nav-btn active" data-view="list">소모품 목록</button>
      <button type="button" class="nav-btn" data-view="stock">입출고 관리</button>
    </nav>
  </aside>

  <main class="content">

    <!-- 소모품 목록 (등록 + 조회) -->
    <section id="view-list" class="view active">
      <h2>소모품 목록</h2>

      <div class="card">
        <h3>소모품 등록</h3>
        <p class="hint">여러 소모품을 한 번에 등록할 수 있습니다. 사진은 선택 사항입니다.</p>
        <div class="table-wrap">
          <table id="bulk-item-table">
            <thead>
              <tr>
                <th>사진</th>
                <th>품목명</th>
                <th>분류</th>
                <th>단위</th>
                <th>비고</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="bulk-item-tbody"></tbody>
          </table>
        </div>
        <div class="form-actions between">
          <button type="button" id="add-row-btn" class="secondary-btn">+ 행 추가</button>
          <button type="button" id="bulk-save-btn">일괄 등록</button>
        </div>
      </div>

      <div class="card">
        <h3>등록된 소모품 조회</h3>
        <input type="text" id="list-search" class="search-box" placeholder="품목명, 분류로 검색...">
        <div class="table-wrap">
          <table id="list-item-table">
            <thead>
              <tr>
                <th>사진</th>
                <th>품목명</th>
                <th>분류</th>
                <th>단위</th>
                <th>비고</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="list-item-tbody"></tbody>
          </table>
        </div>
        <p id="list-item-empty" class="empty-msg" hidden>등록된 소모품이 없습니다.</p>
      </div>
    </section>

    <!-- 입출고 관리 -->
    <section id="view-stock" class="view">
      <h2>입출고 관리</h2>

      <div class="card">
        <input type="text" id="stock-search" class="search-box" placeholder="품목명, 분류로 검색...">
        <div class="table-wrap">
          <table id="stock-item-table">
            <thead>
              <tr>
                <th>사진</th>
                <th>품목명</th>
                <th>분류</th>
                <th>단위</th>
                <th>총입고수량</th>
                <th>총불출수량</th>
                <th>현재고</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="stock-item-tbody"></tbody>
          </table>
        </div>
        <p id="stock-item-empty" class="empty-msg" hidden>등록된 소모품이 없습니다. 소모품 목록에서 먼저 등록해주세요.</p>
      </div>
    </section>

  </main>
</div>

<!-- 입고/출고 입력 모달 -->
<div id="stock-modal-overlay" class="modal-overlay" hidden>
  <div class="modal-box">
    <h3 id="stock-modal-title">입고 등록</h3>
    <p id="stock-modal-item-name" class="selected-info active"></p>
    <form id="stock-modal-form" class="form-grid">
      <label>
        날짜 <span class="required">*</span>
        <div class="date-input" data-date-input="modal-date">
          <input type="text" inputmode="numeric" maxlength="4" class="date-yyyy" placeholder="YYYY">
          <span class="date-sep">-</span>
          <input type="text" inputmode="numeric" maxlength="2" class="date-mm" placeholder="MM">
          <span class="date-sep">-</span>
          <input type="text" inputmode="numeric" maxlength="2" class="date-dd" placeholder="DD">
        </div>
      </label>
      <label>
        수량 <span class="required">*</span>
        <input type="number" id="modal-qty" min="1" step="1" required>
      </label>
      <label class="full">
        수령자 <span class="required">*</span>
        <input type="text" id="modal-recipient" placeholder="수령자 이름" required>
      </label>
      <div class="form-actions between full">
        <button type="button" id="stock-modal-cancel" class="secondary-btn">취소</button>
        <button type="submit" id="stock-modal-submit">저장</button>
      </div>
    </form>
  </div>
</div>

<!-- 입출고 이력 모달 -->
<div id="history-modal-overlay" class="modal-overlay" hidden>
  <div class="modal-box history-modal-box">
    <h3 id="history-modal-title">입출고 이력</h3>
    <div class="table-wrap">
      <table id="history-table">
        <thead>
          <tr>
            <th>날짜</th>
            <th>구분</th>
            <th>수량</th>
            <th>수령자</th>
          </tr>
        </thead>
        <tbody id="history-tbody"></tbody>
      </table>
    </div>
    <p id="history-empty" class="empty-msg" hidden>입출고 이력이 없습니다.</p>
    <div class="form-actions full">
      <button type="button" id="history-modal-close" class="secondary-btn">닫기</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
