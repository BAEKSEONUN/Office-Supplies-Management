<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소모품 관리 브라우저</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>소모품 관리 브라우저</h1>
</header>

<main>
  <!-- 소모품 등록 -->
  <section class="card">
    <h2>소모품 등록</h2>
    <form id="item-form" class="form-grid">
      <label>
        품목명 <span class="required">*</span>
        <input type="text" id="item-name" required placeholder="예) A4 용지">
      </label>
      <label>
        분류
        <input type="text" id="item-category" placeholder="예) 사무용품">
      </label>
      <label>
        단위
        <input type="text" id="item-unit" placeholder="예) 박스, 개, 세트">
      </label>
      <label class="full">
        비고
        <input type="text" id="item-note" placeholder="추가 설명(선택)">
      </label>
      <div class="form-actions full">
        <button type="submit">소모품 등록</button>
      </div>
    </form>
  </section>

  <!-- 소모품 목록 검색/선택 -->
  <section class="card">
    <h2>소모품 목록</h2>
    <input type="text" id="item-search" class="search-box" placeholder="품목명, 분류로 검색...">
    <div class="table-wrap">
      <table id="item-table">
        <thead>
          <tr>
            <th>품목명</th>
            <th>분류</th>
            <th>단위</th>
            <th>비고</th>
            <th>선택</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="item-table-body"></tbody>
      </table>
    </div>
    <p id="item-empty" class="empty-msg" hidden>등록된 소모품이 없습니다. 먼저 소모품을 등록해주세요.</p>
  </section>

  <!-- 사용 기록 입력 -->
  <section class="card">
    <h2>사용 기록 추가</h2>
    <p id="selected-item-info" class="selected-info">선택된 소모품이 없습니다. 위 목록에서 소모품을 선택해주세요.</p>
    <form id="usage-form" class="form-grid">
      <label>
        날짜 <span class="required">*</span>
        <input type="date" id="usage-date" required>
      </label>
      <label>
        수량 <span class="required">*</span>
        <input type="number" id="usage-qty" min="1" step="1" required>
      </label>
      <label class="full">
        비고
        <input type="text" id="usage-note" placeholder="사용 목적, 부서 등(선택)">
      </label>
      <div class="form-actions full">
        <button type="submit" id="usage-submit" disabled>기록 추가</button>
      </div>
    </form>
  </section>

  <!-- 사용 기록 목록 -->
  <section class="card">
    <h2>사용 기록</h2>
    <div class="table-wrap">
      <table id="usage-table">
        <thead>
          <tr>
            <th>날짜</th>
            <th>품목명</th>
            <th>분류</th>
            <th>수량</th>
            <th>단위</th>
            <th>비고</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="usage-table-body"></tbody>
      </table>
    </div>
    <p id="usage-empty" class="empty-msg" hidden>등록된 사용 기록이 없습니다.</p>
  </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
